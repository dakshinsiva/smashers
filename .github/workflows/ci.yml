name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: "Install (lightweight: tests do not need the detector)"
        run: pip install "numpy<2" scipy pandas pyyaml opencv-python-headless scikit-learn pytest ruff
      - name: Lint
        run: ruff check squash run_all.py tests
      - name: Test
        run: pytest -q
